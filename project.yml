name: Mochi
options:
  bundleIdPrefix: com.zen
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
targets:
  Mochi:
    type: application
    platform: macOS
    sources: [Mochi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zen.Mochi
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
  MochiTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MochiTests]
    dependencies:
      - target: Mochi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zen.MochiTests
